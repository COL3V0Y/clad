name: Windows build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Publish
        run: dotnet publish CladTracker.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: CladTracker-windows-x64
          path: bin/Release/net8.0-windows/win-x64/publish/CladTracker.exe
          if-no-files-found: error
